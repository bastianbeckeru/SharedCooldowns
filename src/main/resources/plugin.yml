name: SharedCooldowns
version: '${version}'
main: com.sharedcooldowns.SharedCooldowns
api-version: '26.3'
description: Manages command cooldowns with shared group support.
author: Jnkyns
commands:
  sharedcooldowns:
    description: Check and manage shared cooldowns
    usage: /sharedcooldowns <check|reset|reload|version>
    aliases:
      - scd
permissions:
  sharedcooldowns.admin:
    description: Allows /scd check <player>, reset, reload and version
    default: op
  sharedcooldowns.check:
    description: Allows checking your own cooldowns with /scd check
    default: true
  sharedcooldowns.bypass:
    description: Bypasses all cooldowns
    default: op